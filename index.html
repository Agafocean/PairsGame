<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pairs game</title>
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="main.js"></script>
</head>

<body>
  <div id="startGame" class="startgame">
    <div class="title">PAIRS MEMORY GAME</div>

    <div class="types">
      <button class="type">Numbers</button>
      <button class="type">Pictures</button>
    </div>

    <div class="sizes">
      <button class="size">2x2</button>
      <button class="size">4x4</button>
      <button class="size">6x6</button>
      <button class="size">8x8</button>
      <button class="size">10x10</button>
    </div>

    <img class="gamepic" src="gamepic.jpg" />
    <button id="buttonStart" class="buttonStart">START</button>

    <div class="games"> <span>games:</span> <span id="games"></span>
      <div class="wins"> <span>wins:</span> <span id="wins"></span> </div>
    </div>

  </div>

  <div class="container">
    <div id="deck" class="deck"> </div>
  </div>

  <div class="range" id="range">
    <div class="range-progress" id="range-progress"> </div>
  </div>

  <p id="message" class="message"></p>

  <button id="buttonMore" class="buttonMore">New game</button>

</body>

</html>
