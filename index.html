<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pairs game</title>
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="main.js"></script>
</head>

<body>
  <div class="container" id="container">
    <div id="deck" class="deck"> </div>
    <p id="message" class="message"></p>
  </div>

  <div class="range" id="range">
    <div class="range-progress" id="range-progress"> </div>
  </div>

  <div id="startGame" class="startgame">
    <!--  <div class="title">PAIRS MEMORY GAME</div> -->
    <div id="options" class="options">

        <button class="type">Numbers</button>
        <button class="type">Pictures</button>
        <span>~~</span>

        <button class="size">4x4</button>
        <button class="size">6x6</button>
        <span>~~</span>

        <button class="time">30 sec</button>
        <button class="time">60 sec</button>
        <button class="time">90 sec</button>
        <button class="time">120 sec</button>
        <button class="time">180 sec</button>

    </div>

    <button id="buttonStart" class="buttonStart">START</button>

    <div class="games"> <span>games:</span> <span id="games"></span>
      <div class="wins"> <span>wins:</span> <span id="wins"></span> </div>
    </div>


   <!-- <button id="buttonMore" class="buttonMore">New game</button> -->

    <img class="gamepic" src="gamepic.jpg" />

  </div>

</body>

</html>
